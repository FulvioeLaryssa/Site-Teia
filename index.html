<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b0d">
  <title>TEIA | Desafio de manutenção de PCs</title>
  <style>
    :root {
      color-scheme: dark;
      --red: #ff3048;
      --red-dark: #8f1025;
      --black: #100b0d;
      --panel: #1b1216;
      --muted: #bbaeb2;
      --white: #fff5f6;
      --green: #6ee7a2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--white);
      background:
        radial-gradient(ellipse at 50% -15%, rgba(255, 48, 72, .2), transparent 55%),
        linear-gradient(145deg, #160d11, var(--black) 55%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before, body::after {
      position: fixed;
      z-index: -1;
      width: 240px;
      height: 240px;
      content: "";
      opacity: .14;
      background-image:
        repeating-conic-gradient(from 15deg at 50% 50%, transparent 0deg 14deg, var(--red) 14.5deg 15deg, transparent 15.5deg 30deg),
        repeating-radial-gradient(circle at 50% 50%, transparent 0 24px, var(--red) 25px 26px, transparent 27px 48px);
      mask-image: radial-gradient(circle, #000 5%, transparent 70%);
    }

    body::before { top: -70px; left: -95px; }
    body::after { right: -95px; bottom: -80px; transform: rotate(35deg); }

    button { font: inherit; }

    .quiz {
      width: min(100%, 760px);
      padding: clamp(22px, 5vw, 42px);
      border: 1px solid rgba(255, 48, 72, .28);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(31, 19, 24, .97), rgba(17, 12, 14, .98));
      box-shadow: 0 24px 80px rgba(0, 0, 0, .48), 0 0 45px rgba(255, 48, 72, .08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, .09);
    }

    .brand-mark {
      display: grid;
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 16px;
      color: white;
      background: linear-gradient(145deg, var(--red), var(--red-dark));
      box-shadow: 0 8px 25px rgba(255, 48, 72, .22);
      font-size: 1.12rem;
      font-weight: 900;
      letter-spacing: -.08em;
    }

    .brand-name {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 900;
      letter-spacing: .16em;
    }

    .brand-description {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .77rem;
      letter-spacing: .035em;
    }

    .intro { padding: 27px 0 19px; }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--red);
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 2.65rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .subtitle {
      margin: 11px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 7px 0 21px;
    }

    .stat {
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 14px;
      background: rgba(255, 255, 255, .035);
    }

    .stat-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .stat strong { font-size: 1.16rem; }
    .aura { color: var(--red); }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 700;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      margin-bottom: 24px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .09);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--red-dark), var(--red));
      transition: width .3s ease;
    }

    .question {
      margin: 0 0 17px;
      font-size: clamp(1.12rem, 3vw, 1.4rem);
      line-height: 1.45;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 54px;
      padding: 12px 15px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 13px;
      color: var(--white);
      background: rgba(255, 255, 255, .035);
      text-align: left;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(255, 48, 72, .6);
      background: rgba(255, 48, 72, .08);
    }

    .answer:focus-visible, .primary-button:focus-visible, .secondary-button:focus-visible {
      outline: 3px solid #ff8593;
      outline-offset: 3px;
    }

    .answer.selected {
      border-color: var(--red);
      background: rgba(255, 48, 72, .13);
    }

    .answer.correct {
      border-color: var(--green);
      background: rgba(110, 231, 162, .1);
    }

    .answer.wrong {
      border-color: var(--red);
      background: rgba(255, 48, 72, .14);
    }

    .answer:disabled { cursor: default; }

    .letter {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 8px;
      color: #f7cbd0;
      background: rgba(255, 255, 255, .08);
      font-size: .78rem;
      font-weight: 800;
    }

    .feedback {
      min-height: 0;
      margin-top: 14px;
      padding: 0;
      border-radius: 12px;
      line-height: 1.5;
    }

    .feedback:not(:empty) {
      padding: 13px 15px;
      border: 1px solid rgba(255, 48, 72, .25);
      background: rgba(255, 48, 72, .07);
    }

    .feedback.success:not(:empty) {
      border-color: rgba(110, 231, 162, .25);
      background: rgba(110, 231, 162, .07);
    }

    .feedback strong { display: block; margin-bottom: 3px; }
    .feedback p { margin: 0; color: #dfcdd1; font-size: .91rem; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .primary-button, .secondary-button {
      min-height: 47px;
      padding: 0 19px;
      border: 0;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease;
    }

    .primary-button {
      color: white;
      background: linear-gradient(120deg, var(--red), #d71937);
      box-shadow: 0 8px 20px rgba(255, 48, 72, .18);
    }

    .secondary-button {
      border: 1px solid rgba(255, 255, 255, .14);
      color: var(--white);
      background: rgba(255, 255, 255, .06);
    }

    .primary-button:hover:not(:disabled), .secondary-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    .primary-button:disabled { opacity: .45; cursor: not-allowed; }

    .result { padding: 36px 0 10px; text-align: center; }
    .result-icon { font-size: 3.5rem; }
    .result h2 { margin: 12px 0 8px; font-size: 2rem; }
    .result p { color: var(--muted); line-height: 1.6; }
    .result .primary-button { margin-top: 12px; }
    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      body { padding: 16px 12px; }
      .quiz { border-radius: 19px; }
      .brand-description { max-width: 230px; line-height: 1.45; }
      .actions > button { flex: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="quiz">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">TEIA</div>
      <div>
        <p class="brand-name">TEIA</p>
        <p class="brand-description">Tecnologia, Estudo e Inovação e Avanço</p>
      </div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Desafio técnico</p>
      <h1 id="page-title">Manutenção de PCs</h1>
      <p class="subtitle">Teste seus conhecimentos, acumule pontos e tente não perder toda a sua aura. 👀</p>
    </section>

    <section id="quizArea" aria-live="polite">
      <div class="stats" aria-label="Placar">
        <div class="stat"><span class="stat-label">Pontos</span><strong id="score">0</strong></div>
        <div class="stat"><span class="stat-label">Erros</span><strong class="aura" id="errors">0 · aura intacta</strong></div>
      </div>
      <div class="progress-row">
        <span id="questionCounter">Pergunta 1 de 8</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Progresso do quiz" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <form id="answerForm">
        <h2 class="question" id="questionText"></h2>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback" role="status" aria-live="assertive"></div>
        <div class="actions">
          <button class="primary-button" id="submitButton" type="submit" disabled>Enviar resposta</button>
          <button class="primary-button" id="nextButton" type="button" hidden>Próxima pergunta</button>
        </div>
      </form>
    </section>

    <section class="result" id="resultArea" aria-live="polite" hidden>
      <div class="result-icon" id="resultIcon" aria-hidden="true">🏁</div>
      <h2 id="resultTitle">Desafio concluído!</h2>
      <p id="resultMessage"></p>
      <button class="primary-button" id="restartButton" type="button">Jogar de novo</button>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Antes de abrir o gabinete para fazer uma manutenção, qual é a primeira atitude segura?",
        answers: ["Desligar o PC, tirar da tomada e pressionar o botão power por alguns segundos", "Deixar ligado para enxergar melhor", "Desconectar só o teclado"],
        correct: 0,
        explanation: "Desligue e desconecte o equipamento da energia antes de mexer nos componentes.",
        joke: "Foi no modo turbo da confiança. Errou —100 aura! ⚡"
      },
      {
        question: "Para reduzir o risco de descarga eletrostática nos componentes, o que é recomendado?",
        answers: ["Trabalhar sobre um tapete felpudo", "Usar pulseira antiestática aterrada ou tocar uma superfície metálica aterrada", "Esfregar as mãos para aquecer"],
        correct: 1,
        explanation: "A pulseira antiestática aterrada ajuda a descarregar a eletricidade estática com segurança.",
        joke: "Seu dedo virou um raio. Errou —100 aura! ⚡"
      },
      {
        question: "Qual é a forma correta de remover poeira das ventoinhas e do gabinete?",
        answers: ["Usar ar comprimido em jatos curtos, segurando as hélices", "Lavar com água corrente", "Assoprar bem de pertinho"],
        correct: 0,
        explanation: "Jatos curtos ajudam a remover a poeira. Segure as hélices para não deixá-las girar em excesso.",
        joke: "O PC não é roupa para ir ao tanque. Errou —100 aura! 🫧"
      },
      {
        question: "Onde a pasta térmica deve ser aplicada?",
        answers: ["Em todos os componentes da placa-mãe", "Entre o processador e a base do cooler, em pequena quantidade", "Dentro da fonte de alimentação"],
        correct: 1,
        explanation: "Uma pequena quantidade entre o processador e o cooler melhora a transferência de calor.",
        joke: "Pasta térmica não é cobertura de bolo. Errou —100 aura! 🍰"
      },
      {
        question: "O computador está muito lento e o armazenamento vive cheio. Qual pode ser uma boa melhoria?",
        answers: ["Instalar um SSD e verificar o espaço e os programas iniciados com o sistema", "Colocar mais adesivos no gabinete", "Apagar arquivos aleatórios do Windows"],
        correct: 0,
        explanation: "Um SSD pode melhorar bastante a inicialização e o carregamento. Também vale revisar programas e espaço disponível.",
        joke: "Adesivo gamer não aumenta FPS. Errou —100 aura! 🎮"
      },
      {
        question: "Qual cuidado é importante ao limpar uma tela?",
        answers: ["Borrifar limpa-vidros diretamente na tela", "Usar pano de microfibra e produto apropriado, sem aplicar líquido diretamente", "Esfregar com papel toalha"],
        correct: 1,
        explanation: "Pano de microfibra e produto indicado para telas evitam riscos e excesso de líquido.",
        joke: "A tela não pediu banho. Errou —100 aura! 🧽"
      },
      {
        question: "O PC desligou sozinho durante uma tarefa pesada. O que vale investigar primeiro?",
        answers: ["Temperaturas, ventilação e funcionamento das ventoinhas", "A cor do papel de parede", "Se o mouse está combinando com o gabinete"],
        correct: 0,
        explanation: "Superaquecimento pode causar desligamentos. Confira temperaturas, poeira, cooler e fluxo de ar.",
        joke: "O mouse não controla a temperatura — quem dera! Errou —100 aura! 🐭"
      },
      {
        question: "Depois da manutenção, o PC não dá vídeo. Qual é um primeiro passo sensato?",
        answers: ["Revisar cabos, memória RAM e conexões, sempre com o PC desligado", "Bater no gabinete para dar sorte", "Formatar o computador imediatamente"],
        correct: 0,
        explanation: "Verifique com o equipamento desligado se os cabos e componentes, como a memória RAM, estão bem conectados.",
        joke: "Técnica do tapinha não está no manual. Errou —100 aura! 🤕"
      }
    ];

    const jokeForCorrect = ["Boa! +100 aura de técnico(a)! ✨", "Mandou bem: o PC agradece! 🛠️", "Acertou! Seu multímetro imaginário aprovou. ✅"];
    const questionText = document.getElementById("questionText");
    const answersElement = document.getElementById("answers");
    const answerForm = document.getElementById("answerForm");
    const submitButton = document.getElementById("submitButton");
    const nextButton = document.getElementById("nextButton");
    const feedback = document.getElementById("feedback");
    const scoreElement = document.getElementById("score");
    const errorsElement = document.getElementById("errors");
    const counterElement = document.getElementById("questionCounter");
    const progressPercent = document.getElementById("progressPercent");
    const progressBar = document.getElementById("progressBar");
    const progressTrack = document.querySelector(".progress-track");
    const quizArea = document.getElementById("quizArea");
    const resultArea = document.getElementById("resultArea");

    let currentQuestion = 0;
    let selectedAnswer = null;
    let score = 0;
    let errors = 0;
    let answered = false;

    function updateProgress() {
      const completed = currentQuestion;
      const percent = Math.round((completed / questions.length) * 100);
      counterElement.textContent = `Pergunta ${Math.min(currentQuestion + 1, questions.length)} de ${questions.length}`;
      progressPercent.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;
      progressTrack.setAttribute("aria-valuemax", String(questions.length));
      progressTrack.setAttribute("aria-valuenow", String(completed));
    }

    function updateScoreboard() {
      scoreElement.textContent = String(score);
      errorsElement.textContent = errors === 0 ? "0 · aura intacta" : `${errors} · −${errors * 100} aura`;
    }

    function renderQuestion() {
      const item = questions[currentQuestion];
      selectedAnswer = null;
      answered = false;
      questionText.textContent = item.question;
      answersElement.replaceChildren();
      feedback.textContent = "";
      feedback.className = "feedback";
      submitButton.hidden = false;
      submitButton.disabled = true;
      nextButton.hidden = true;
      updateProgress();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.setAttribute("aria-pressed", "false");
        const letter = document.createElement("span");
        letter.className = "letter";
        letter.textContent = String.fromCharCode(65 + index);
        const text = document.createElement("span");
        text.textContent = answer;
        button.append(letter, text);
        button.addEventListener("click", () => {
          if (answered) return;
          selectedAnswer = index;
          submitButton.disabled = false;
          answersElement.querySelectorAll(".answer").forEach((option) => {
            option.classList.remove("selected");
            option.setAttribute("aria-pressed", "false");
          });
          button.classList.add("selected");
          button.setAttribute("aria-pressed", "true");
        });
        answersElement.append(button);
      });
    }

    answerForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (selectedAnswer === null || answered) return;
      answered = true;
      const item = questions[currentQuestion];
      const options = [...answersElement.querySelectorAll(".answer")];
      options.forEach((option) => { option.disabled = true; });

      if (selectedAnswer === item.correct) {
        score += 1;
        feedback.className = "feedback success";
        feedback.innerHTML = `<strong>${jokeForCorrect[Math.floor(Math.random() * jokeForCorrect.length)]}</strong><p>${item.explanation}</p>`;
        options[selectedAnswer].classList.add("correct");
      } else {
        errors += 1;
        feedback.className = "feedback";
        feedback.innerHTML = `<strong>${item.joke}</strong><p>Resposta certa: ${item.answers[item.correct]}. ${item.explanation}</p>`;
        options[selectedAnswer].classList.add("wrong");
        options[item.correct].classList.add("correct");
      }

      updateScoreboard();
      submitButton.hidden = true;
      nextButton.hidden = false;
      nextButton.textContent = currentQuestion === questions.length - 1 ? "Ver resultado" : "Próxima pergunta";
      nextButton.focus();
    });

    nextButton.addEventListener("click", () => {
      currentQuestion += 1;
      if (currentQuestion < questions.length) {
        renderQuestion();
        questionText.focus?.();
        return;
      }
      showResult();
    });

    function showResult() {
      quizArea.hidden = true;
      resultArea.hidden = false;
      const percent = Math.round((score / questions.length) * 100);
      const resultIcon = document.getElementById("resultIcon");
      const resultTitle = document.getElementById("resultTitle");
      const resultMessage = document.getElementById("resultMessage");
      resultIcon.textContent = score === questions.length ? "🏆" : score >= 5 ? "🛠️" : "🔧";
      resultTitle.textContent = score === questions.length ? "Lenda da manutenção!" : score >= 5 ? "Mandou bem!" : "Treino concluído!";
      resultMessage.textContent = `Você acertou ${score} de ${questions.length} perguntas (${percent}%) e cometeu ${errors} ${errors === 1 ? "erro" : "erros"}. ${errors === 0 ? "Aura máxima: nenhum erro!" : `Saldo final de aura: ${Math.max(0, 1000 - errors * 100)}.`}`;
      document.getElementById("restartButton").focus();
    }

    document.getElementById("restartButton").addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      errors = 0;
      updateScoreboard();
      quizArea.hidden = false;
      resultArea.hidden = true;
      renderQuestion();
    });

    updateScoreboard();
    renderQuestion();
  </script>
</body>
</html>
